name: census

on:
  push:
    branches: [main, merge/integration]
  workflow_dispatch:

# The project is in Xcode 16+ project format (objectVersion 77) and targets
# macOS 26.5, so the old macos-14 / Xcode 15.4 runner cannot even open it.
# macos-26 provides Xcode 26.6 and the macOS 26.5 SDK.
jobs:
  census:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | tail -12

      - name: Sentinel surface manifest freshness
        # A feature that adds a table, preference, or notification without
        # regenerating the manifest fails here. SQL-016 and SELF-011 consume the
        # generated catalog, so this is the inventory half of auto-coverage.
        run: ./scripts/verify-sentinel-surface.sh

      - name: Unit census (green = merge-presence receipt)
        shell: bash
        run: |
          set -o pipefail

          # UI tests in this repository are placeholder launch stubs and depend
          # on the interactive macOS automation bootstrap. The merge-presence
          # receipt is the deterministic unit target, matching the verified
          # local `scripts/census.sh --unit-only` gate.
          #
          # The bundled-runtime presence assertion is self-gated on the ignored
          # 47 MB .mirage-runtime staging directory. A clean CI checkout builds
          # without it, so that one assertion skips; the synthetic runtime
          # contract tests still run.
          xcodebuild test \
            -project "AsterismaV1.0.xcodeproj" \
            -scheme "AsterismaV1.0" \
            -configuration Debug \
            -destination 'platform=macOS' \
            -parallel-testing-enabled NO \
            -only-testing:AsterismaV1.0Tests \
            2>&1 | tee census.log | grep -E "Test run with|TEST (SUCCEEDED|FAILED)|error:"

          grep -q "TEST SUCCEEDED" census.log

      - name: Upload census receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: census-log-${{ github.sha }}
          path: census.log
          if-no-files-found: error
